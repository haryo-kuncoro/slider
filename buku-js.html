<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Buku Wisuda - A5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; }
    #loading { display: none; margin-top: 15px; font-size: 13px; color: gray; }
  </style>
</head>
<body>
  <h2 id="judul-buku">Buku Wisuda</h2>
  <p id="info-buku">Menampilkan semua data dari <b>data-buku.php</b></p>
  <button id="generate" class="btn">📘 Generate PDF Semua Prodi</button>
  <div id="loading">⏳ Sedang memproses data wisuda...</div>

  <script>
    const { jsPDF } = window.jspdf;

    // Fungsi ambil parameter dari URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param) || "";
    }

    // Ambil nilai prodi dari URL (misal ?prodi=Hukum)
    const selectedProdi = getQueryParam("prodi");

    // Elemen-elemen yang mau diubah
    const judul = document.getElementById("judul-buku");
    const info = document.getElementById("info-buku");
    const tombol = document.getElementById("generate");

    // Jika ada prodi di URL
    if (selectedProdi) {
      judul.textContent = `Buku Wisuda – ${selectedProdi}`;
      info.innerHTML = `Menampilkan data wisudawan untuk <b>Program Studi ${selectedProdi}</b> dari <b>data-buku.php?prodi=${selectedProdi}</b>`;
      tombol.textContent = `📘 Generate PDF Prodi ${selectedProdi}`;
    } else {
      judul.textContent = "Buku Wisuda – Semua Prodi";
      info.innerHTML = `Menampilkan semua data wisudawan dari <b>data-buku.php</b>`;
      tombol.textContent = "📘 Generate PDF Semua Prodi";
    }

    async function getBase64Image(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (err) {
        console.warn("Gagal ambil gambar:", url);
        return null;
      }
    }

    document.getElementById("generate").addEventListener("click", async () => {
      const loading = document.getElementById("loading");
      loading.style.display = "block";

      try {
        // === panggil data-buku.php sesuai prodi ===
        let url = "data-buku.php";
        if (selectedProdi) {
          url += "?prodi=" + encodeURIComponent(selectedProdi);
        }

        const response = await fetch(url);
        if (!response.ok) throw new Error("Gagal memuat " + url);

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          alert("❌ Tidak ada data wisudawan ditemukan.");
          loading.style.display = "none";
          return;
        }

        const doc = new jsPDF({ format: "a5", unit: "mm" });
        const perPage = 4;
        const margin = 10;
        const fotoW = 25;
        const fotoH = 32;
        const textStartX = margin + fotoW + 5;
        let y = margin;

        for (let i = 0; i < data.length; i++) {
          const mhs = data[i];
          const foto = await getBase64Image(mhs.foto);

          const noUrut = (i + 1).toString().padStart(2, "0");

          if (foto) {
            doc.addImage(foto, "JPEG", margin, y, fotoW, fotoH);
          } else {
            doc.rect(margin, y, fotoW, fotoH);
          }

          const xLabel = textStartX;
          const xSeparator = textStartX + 22;
          const xValue = textStartX + 24;

          doc.setFontSize(7);
          let tY = y + 2;
          doc.text("No. Urut", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.nourut}`, xValue, tY); tY += 3.3;

          doc.text("Nama", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.nama}`, xValue, tY); tY += 3.3;

          doc.text("NPM", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.nirm}`, xValue, tY); tY += 3.3;

          doc.text("Tempat/Tgl Lahir", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.tmpttl}`, xValue, tY); tY += 3.3;

          doc.text("Program Studi", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.prodi}`, xValue, tY); tY += 3.3;

          doc.text("Asal Sekolah", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.asalsekolah}`, xValue, tY); tY += 4;

          doc.text("Nama Orangtua", xLabel, tY);
          doc.text(` `, xValue, tY); tY += 3.3;

          doc.text("Ayah", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.ayah}`, xValue, tY); tY += 3.3;

          doc.text("Ibu", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          doc.text(`${mhs.ibu}`, xValue, tY); tY += 3.3;

          const maxWidth = 75;

          doc.text("Alamat", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          // doc.text(`${mhs.alamat}`, xValue, tY); tY += 3.3;
          const alamatLines = doc.splitTextToSize(`${mhs.alamat}`, maxWidth);
          doc.text(alamatLines, xValue, tY);
          tY += (alamatLines.length * 3);

          doc.text("Judul Skripsi", xLabel, tY);
          doc.text(`:`, xSeparator, tY);
          // const maxWidth = 80;
          const judulLines = doc.splitTextToSize(`${mhs.judul}`, maxWidth);
          doc.text(judulLines, xValue, tY);
          tY += (judulLines.length * 4);

          y += fotoH + (judulLines.length * 2) + (alamatLines.length * 2) + 8;

          if ((i + 1) % perPage === 0 && i < data.length - 1) {
            doc.addPage();
            y = margin;
          }
        }

        // Nama file otomatis
        const namaFile = "Buku_Wisuda_" + (selectedProdi || "Semua_Prodi") + ".pdf";
        doc.save(namaFile);
      } catch (e) {
        console.error(e);
        alert("Terjadi kesalahan: " + e.message);
      } finally {
        loading.style.display = "none";
      }
    });
  </script>

</body>
</html>
