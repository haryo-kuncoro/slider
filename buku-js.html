<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Buku Wisuda - A5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; }
    #loading { display: none; margin-top: 15px; font-size: 13px; color: gray; }
  </style>
</head>
<body>
  <h2>Buku Wisuda</h2>
  <p>Menampilkan semua data dari <b>data-buku.php</b></p>
  <button id="generate">📘 Generate PDF Semua Prodi</button>
  <div id="loading">⏳ Sedang memproses data wisuda...</div>

  <script>
    const { jsPDF } = window.jspdf;

    async function getBase64Image(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (err) {
        console.warn("Gagal ambil gambar:", url);
        return null;
      }
    }

    document.getElementById("generate").addEventListener("click", async () => {
      const loading = document.getElementById("loading");
      loading.style.display = "block";

      try {
        const response = await fetch("data-buku.php");
        if (!response.ok) throw new Error("Gagal memuat data-buku.php");
        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          alert("❌ Tidak ada data wisudawan ditemukan.");
          loading.style.display = "none";
          return;
        }

        const doc = new jsPDF({ format: "a5", unit: "mm" });
        const perPage = 4; // 4 wisudawan per halaman
        const margin = 10;
        const fotoW = 25;
        const fotoH = 32;
        const textStartX = margin + fotoW + 5;
        let y = margin;

        for (let i = 0; i < data.length; i++) {
          const mhs = data[i];
          const foto = await getBase64Image(mhs.foto);

          // Tambah nomor urut
          const noUrut = (i + 1).toString().padStart(2, "0");

          // Gambar foto (kiri)
          if (foto) {
            doc.addImage(foto, "JPEG", margin, y, fotoW, fotoH);
          } else {
            doc.rect(margin, y, fotoW, fotoH); // kotak kosong jika foto tidak ditemukan
          }

          // Teks keterangan
          const xLabel = textStartX;
          const xValue = textStartX + 23; // jarak antar kolom label dan nilai

          doc.setFontSize(7);
          let tY = y + 2;
          doc.text("No. Urut", xLabel, tY);
          doc.text(`: ${noUrut}`, xValue, tY); tY += 3.3;

          doc.text("Nama", xLabel, tY);
          doc.text(`: ${mhs.nama}`, xValue, tY); tY += 3.3;

          doc.text("NPM", xLabel, tY);
          doc.text(`: ${mhs.nirm}`, xValue, tY); tY += 3.3;

          doc.text("Tempat/Tgl Lahir", xLabel, tY);
          doc.text(`: ${mhs.tmpttl}`, xValue, tY); tY += 3.3;

          doc.text("Program Studi", xLabel, tY);
          doc.text(`: ${mhs.prodi}`, xValue, tY); tY += 3.3;

          doc.text("Asal Sekolah", xLabel, tY);
          doc.text(`: ${mhs.asalsekolah}`, xValue, tY); tY += 4;

          doc.text("Nama Orangtua", xLabel, tY);
          doc.text(` `, xValue, tY); tY += 3.3;

          doc.text("Ayah", xLabel, tY);
          doc.text(`: ${mhs.ayah}`, xValue, tY); tY += 3.3;

          doc.text("Ibu", xLabel, tY);
          doc.text(`: ${mhs.ibu}`, xValue, tY); tY += 3.3;

          doc.text("Alamat", xLabel, tY);
          doc.text(`: ${mhs.alamat}`, xValue, tY); tY += 3.3;

          // ==== BAGIAN JUDUL SKRIPSI ====
          doc.text("Judul Skripsi", xLabel, tY);
          const maxWidth = 80; 
          const judulLines = doc.splitTextToSize(`: ${mhs.judul}`, maxWidth);
          doc.text(judulLines, xValue, tY);
          tY += (judulLines.length * 4);

          // Spasi antar data
          y += fotoH + (judulLines.length * 2) + 8;

          // Ganti halaman tiap 4 wisudawan
          if ((i + 1) % perPage === 0 && i < data.length - 1) {
            doc.addPage();
            y = margin;
          }
        }

        doc.save("Buku_Wisuda_A5.pdf");
      } catch (e) {
        console.error(e);
        alert("Terjadi kesalahan: " + e.message);
      } finally {
        loading.style.display = "none";
      }
    });
  </script>
</body>
</html>
