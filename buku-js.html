<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <title>Buku Wisuda - A5</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }

        #loading {
            display: none;
            margin-top: 15px;
            font-size: 13px;
            color: gray;
        }

    </style>

</head>


<body>


    <h2 id="judul-buku">
        Buku Wisuda
    </h2>


    <p id="info-buku">
        Menampilkan semua data dari
        <b>data-buku.php</b>
    </p>


    <button id="generate">
        📘 Generate PDF Semua Prodi
    </button>


    <div id="loading">
        ⏳ Sedang memproses data wisuda...
    </div>



<script>


/* =========================================================
   JSPDF
   ========================================================= */

const { jsPDF } = window.jspdf;



/* =========================================================
   FUNGSI AMBIL PARAMETER URL
   ========================================================= */

function getQueryParam(param) {

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    return urlParams.get(param) || "";
}



/* =========================================================
   PRODI DARI URL
   =========================================================
   
   Contoh:
   
   ?prodi=Sistem%20Informasi
   
   selectedProdi hanya digunakan untuk FILTER DATA.
   
   Nama prodi yang ditampilkan di PDF akan diambil
   langsung dari mhs.prodi.
   
   ========================================================= */

const selectedProdi =
    getQueryParam("prodi");



/* =========================================================
   ELEMENT HTML
   ========================================================= */

const judul =
    document.getElementById(
        "judul-buku"
    );

const info =
    document.getElementById(
        "info-buku"
    );

const tombol =
    document.getElementById(
        "generate"
    );



/* =========================================================
   TAMPILAN HALAMAN HTML
   ========================================================= */

if (selectedProdi) {

    judul.textContent =
        `Buku Wisuda – ${selectedProdi}`;

    info.innerHTML =
        `Menampilkan data wisudawan untuk
        <b>Program Studi ${selectedProdi}</b>
        dari
        <b>data-buku.php?prodi=${selectedProdi}</b>`;

    tombol.textContent =
        `📘 Generate PDF Prodi ${selectedProdi}`;

} else {

    judul.textContent =
        "Buku Wisuda – Semua Prodi";

    info.innerHTML =
        `Menampilkan semua data wisudawan
        dari <b>data-buku.php</b>`;

    tombol.textContent =
        "📘 Generate PDF Semua Prodi";
}



/* =========================================================
   AMBIL GAMBAR SEBAGAI BASE64
   ========================================================= */

async function getImage(url) {

    try {

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Gambar tidak ditemukan"
            );
        }


        const blob =
            await response.blob();


        return await new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();


                reader.onloadend =
                    () => {

                        resolve(
                            reader.result
                        );

                    };


                reader.onerror =
                    reject;


                reader.readAsDataURL(
                    blob
                );

            }
        );

    } catch (error) {

        console.warn(
            "Gagal mengambil gambar:",
            url
        );

        return null;
    }
}



/* =========================================================
   BUAT FOTO MENJADI LINGKARAN
   ========================================================= */

async function getCircularImage(url) {

    try {

        /*
         * Ambil gambar
         */

        const base64 =
            await getImage(url);


        if (!base64) {

            return null;
        }


        /*
         * Buat object Image
         */

        const img =
            new Image();


        img.src =
            base64;


        /*
         * Tunggu gambar selesai loading
         */

        await new Promise(
            (resolve, reject) => {

                img.onload =
                    resolve;

                img.onerror =
                    reject;

            }
        );


        /*
         * Ukuran canvas
         */

        const size =
            500;


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            size;

        canvas.height =
            size;


        const ctx =
            canvas.getContext(
                "2d"
            );


        /*
         * Bersihkan canvas
         */

        ctx.clearRect(
            0,
            0,
            size,
            size
        );


        /*
         * Buat clipping lingkaran
         */

        ctx.beginPath();

        ctx.arc(
            size / 2,
            size / 2,
            size / 2,
            0,
            Math.PI * 2
        );

        ctx.closePath();

        ctx.clip();


        /*
        * Crop gambar menjadi persegi
        *
        * Bagian ATAS dipertahankan.
        * Jika tinggi foto lebih besar dari lebar,
        * bagian yang terpotong adalah bagian BAWAH.
        */

        const cropWidth = img.width;
        const cropHeight = img.width;

        const sx = 0;
        const sy = 0;


        /*
        * Gambar ke canvas
        */

        ctx.drawImage(
            img,
            sx,
            sy,
            cropWidth,
            cropHeight,
            0,
            0,
            size,
            size
        );


        /*
         * Kembalikan PNG transparan
         */

        return canvas.toDataURL(
            "image/png"
        );

    } catch (error) {

        console.warn(
            "Gagal membuat foto lingkaran:",
            url
        );

        return null;
    }
}



/* =========================================================
   HEADER PDF
   =========================================================
   
   namaProdi DIAMBIL DARI JSON
   
   ========================================================= */

async function drawHeader(
    doc,
    namaProdi
) {


    const pageWidth =
        doc.internal.pageSize.getWidth();


    const margin =
        10;



    /* =====================================================
       GARIS ATAS HEADER
       ===================================================== */

    doc.setLineWidth(
        0.3
    );

    doc.line(
        margin,
        6,
        pageWidth - margin,
        6
    );


    /* =====================================================
       LOGO
       ===================================================== */

    const logoUrl =
        "img/logo/logo.png";


    let logo =
        null;


    try {

        logo =
            await getImage(
                logoUrl
            );

    } catch (e) {

        logo =
            null;
    }


    const logoX =
        margin;


    const logoY =
        8;


    /* =====================================================
       UKURAN LOGO
       =====================================================

       Tinggi logo tetap 10 mm.
       Lebar mengikuti rasio asli gambar agar logo
       tidak dipaksa menjadi persegi.

       ===================================================== */

    const logoHeight =
        10;

    let logoWidth =
        logoHeight;


    if (logo) {

        /* Ambil ukuran asli gambar dari data URL */
        const imgLogo =
            new Image();

        imgLogo.src =
            logo;

        await new Promise(
            (resolve) => {
                imgLogo.onload =
                    resolve;

                imgLogo.onerror =
                    resolve;
            }
        );

        if (
            imgLogo.naturalWidth &&
            imgLogo.naturalHeight
        ) {

            logoWidth =
                logoHeight *
                (
                    imgLogo.naturalWidth /
                    imgLogo.naturalHeight
                );

        }


        doc.addImage(
            logo,
            "PNG",
            logoX,
            logoY,
            logoWidth,
            logoHeight
        );

    } else {

        /*
         * Placeholder jika logo tidak ada
         */

        doc.setLineWidth(
            0.3
        );


        doc.circle(
            logoX + 5,
            logoY + 5,
            4,
            "S"
        );

    }



    /* =====================================================
       NAMA INSTITUSI
       ===================================================== */

    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(
        10
    );


    doc.text(
        "STMIK Triguna Dharma",
        margin + 15,
        14
    );



    /* =====================================================
       NAMA PRODI
       =====================================================
       
       DIAMBIL DARI:
       
       mhs.prodi
       
       ===================================================== */

    doc.setFont(
        "helvetica",
        "normal"
    );


    /*
     * Jika prodi panjang,
     * gunakan font lebih kecil
     */

    if (
        namaProdi &&
        namaProdi.length > 25
    ) {

        doc.setFontSize(
            8
        );

    } else {

        doc.setFontSize(
            9
        );

    }


    doc.text(
        namaProdi || "",
        pageWidth - margin,
        14,
        {
            align: "right"
        }
    );



    /* =====================================================
       GARIS HEADER
       ===================================================== */

    doc.setLineWidth(
        0.3
    );


    doc.line(
        margin,
        20,
        pageWidth - margin,
        20
    );



    /* =====================================================
       POSISI AWAL DATA
       ===================================================== */

    return 24;
}



/* =========================================================
   GAMBAR SATU WISUDAWAN
   ========================================================= */

async function drawStudent(
    doc,
    mhs,
    y,
    positionIndex
) {


    const pageWidth =
        doc.internal.pageSize.getWidth();


    const margin =
        10;



    /* =====================================================
       UKURAN FOTO
       ===================================================== */

    const fotoSize =
        28;



    /* =====================================================
       POSISI FOTO
       =====================================================
       
       0 = kiri
       1 = kanan
       2 = kiri
       3 = kanan
       4 = kiri
       
       positionIndex DI-RESET setiap 5 data.
       
       ===================================================== */

    const fotoKiri =
        positionIndex % 2 === 0;


    let fotoX;


    if (fotoKiri) {

        fotoX =
            margin;

    } else {

        fotoX =
            pageWidth -
            margin -
            fotoSize;

    }



    /* =====================================================
       FOTO
       ===================================================== */

    const foto =
        await getCircularImage(
            mhs.foto
        );


    if (foto) {

        doc.addImage(
            foto,
            "PNG",
            fotoX,
            y,
            fotoSize,
            fotoSize
        );

    } else {

        /*
         * Lingkaran kosong jika foto tidak ada
         */

        doc.setLineWidth(
            0.4
        );


        doc.circle(
            fotoX +
                fotoSize / 2,
            y +
                fotoSize / 2,
            fotoSize / 2,
            "S"
        );

    }



    /* =====================================================
       JARAK FOTO DENGAN TEXT
       ===================================================== */

    const gap =
        5;


    let textX;


    if (fotoKiri) {

        /*
         * FOTO KIRI
         * TEXT KANAN
         */

        textX =
            fotoX +
            fotoSize +
            gap;

    } else {

        /*
         * FOTO KANAN
         * TEXT KIRI
         */

        textX =
            margin;

    }



    /* =====================================================
       LEBAR AREA TEXT
       ===================================================== */

    const textRight =
        fotoKiri
            ? pageWidth - margin
            : fotoX - gap;


    const textWidth =
        textRight -
        textX;



    /* =====================================================
       POSISI TEXT
       ===================================================== */

    let tY =
        y + 2;



    /* =====================================================
       NAMA + NIRM
       ===================================================== */

    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(
        8
    );


    const nama =
        mhs.nama || "-";


    const nirm =
        mhs.nirm || "";


    const namaText =
        nirm
            ? `${nama} (${nirm})`
            : nama;


    const namaLines =
        doc.splitTextToSize(
            namaText,
            textWidth
        );


    doc.text(
        namaLines,
        textX,
        tY
    );


    tY +=
        namaLines.length *
        3.5;



    /* =====================================================
    ANAK DARI
    ===================================================== */

    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(
        7
    );

    doc.text(
        "Anak dari:",
        textX,
        tY
    );

    tY += 2.8;


    /* =====================================================
    AYAH + IBU
    ===================================================== */

    doc.setFont(
        "helvetica",
        "normal"
    );

    const orangTua = [];

    if (mhs.ayah) {
        orangTua.push(mhs.ayah);
    }

    if (mhs.ibu) {
        orangTua.push(mhs.ibu);
    }

    const orangTuaText =
        orangTua.length
            ? orangTua.join(" | ")
            : "-";


    const orangTuaLines =
        doc.splitTextToSize(
            orangTuaText,
            textWidth
        );


    doc.text(
        orangTuaLines,
        textX,
        tY
    );


    /*
    * Tinggi nama orang tua
    */

    tY +=
        orangTuaLines.length * 3.0;


    /*
    * JARAK ANTARA ORANG TUA DAN IPK
    *
    * Naikkan angka ini jika ingin
    * jarak lebih renggang.
    */

    tY += 1.2;



    /* =====================================================
    IPK
    ===================================================== */

    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(
        7
    );

    const ipkText =
        `IPK : ${mhs.ipk || "-"}`;

    doc.text(
        ipkText,
        textX,
        tY
    );

    if (mhs.keterangan_ipk) {

        doc.setFont(
            "helvetica",
            "normal"
        );

        doc.text(
            ` (${mhs.keterangan_ipk})`,
            textX +
                doc.getTextWidth(
                    ipkText
                ),
            tY
        );
    }

    tY += 3.8;


    /* =====================================================
       JUDUL TA / SKRIPSI
       ===================================================== */

    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(
        7
    );


    doc.text(
        "Judul TA/Skripsi:",
        textX,
        tY
    );


    tY +=
        3.2;


    doc.setFont(
        "helvetica",
        "normal"
    );


    const judul =
        mhs.judul || "-";


    const judulLines =
        doc.splitTextToSize(
            judul,
            textWidth
        );


    doc.text(
        judulLines,
        textX,
        tY
    );


    tY +=
        judulLines.length *
        3.1;



    /* =====================================================
       TINGGI CONTENT
       ===================================================== */

    const contentHeight =
        Math.max(
            fotoSize,
            tY - y
        );



    /* =====================================================
       PADDING SEBELUM GARIS
       =====================================================
       
       Jarak data dengan garis.
       
       ===================================================== */

    const paddingBeforeLine =
        3;



    /* =====================================================
       PADDING SETELAH GARIS
       =====================================================
       
       Jarak garis dengan data berikutnya.
       
       ===================================================== */

    const paddingAfterLine =
        4;



    /* =====================================================
       TINGGI TOTAL BARIS
       ===================================================== */

    const rowHeight =
        contentHeight +
        paddingBeforeLine +
        paddingAfterLine;



    /* =====================================================
       POSISI GARIS
       ===================================================== */

    const lineY =
        y +
        contentHeight +
        paddingBeforeLine;


    doc.setLineWidth(
        0.25
    );


    doc.line(
        margin,
        lineY,
        pageWidth - margin,
        lineY
    );



    /* =====================================================
       KEMBALIKAN TINGGI BARIS
       ===================================================== */

    return rowHeight;
}



/* =========================================================
   FOOTER
   ========================================================= */

function drawFooter(
    doc,
    pageNumber
) {


    const pageWidth =
        doc.internal.pageSize.getWidth();


    const pageHeight =
        doc.internal.pageSize.getHeight();


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(
        7
    );


    doc.text(
        String(pageNumber),
        pageWidth / 2,
        pageHeight - 7,
        {
            align: "center"
        }
    );

}



/* =========================================================
   GENERATE PDF
   ========================================================= */

document
    .getElementById("generate")
    .addEventListener(
        "click",
        async function () {


            const loading =
                document.getElementById(
                    "loading"
                );


            loading.style.display =
                "block";


            try {


                /* =================================================
                   URL DATA
                   ================================================= */

                let url =
                    "data-buku.php";


                /*
                 * selectedProdi hanya untuk FILTER
                 */

                if (
                    selectedProdi
                ) {

                    url +=
                        "?prodi=" +
                        encodeURIComponent(
                            selectedProdi
                        );

                }



                /* =================================================
                   AMBIL DATA JSON
                   ================================================= */

                const response =
                    await fetch(
                        url
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Gagal memuat " +
                        url
                    );

                }


                const data =
                    await response.json();



                /* =================================================
                   VALIDASI DATA
                   ================================================= */

                if (
                    !Array.isArray(
                        data
                    ) ||
                    data.length === 0
                ) {

                    alert(
                        "❌ Tidak ada data wisudawan ditemukan."
                    );

                    return;

                }



                /* =================================================
                   BUAT PDF A5
                   ================================================= */

                const doc =
                    new jsPDF({
                        format: "a5",
                        unit: "mm",
                        orientation: "portrait"
                    });



                /* =================================================
                   KONFIGURASI
                   ================================================= */

                const perPage =
                    5;


                let pageNumber =
                    1;



                /* =================================================
                   PRODI HALAMAN PERTAMA
                   =================================================
                   
                   Ambil langsung dari JSON:
                   
                   data[0].prodi
                   
                   ================================================= */

                const firstProdi =
                    data[0].prodi || "";



                /* =================================================
                   HEADER HALAMAN PERTAMA
                   ================================================= */

                let y =
                    await drawHeader(
                        doc,
                        firstProdi
                    );



                /* =================================================
                   LOOP DATA
                   =================================================

                   ATURAN:
                   1. Maksimal 5 mahasiswa per halaman.
                   2. Jika prodi berubah, WAJIB mulai halaman baru.
                   3. Posisi kiri/kanan di-reset setiap halaman.

                   ================================================= */

                let currentProdi =
                    data[0].prodi || "";

                let positionIndex =
                    0;

                for (
                    let i = 0;
                    i < data.length;
                    i++
                ) {

                    const mhs =
                        data[i];

                    const mahasiswaProdi =
                        mhs.prodi || "";


                    /* =================================================
                       CEK PERGANTIAN PRODI
                       ================================================= */

                    if (
                        i > 0 &&
                        mahasiswaProdi !== currentProdi
                    ) {

                        /* =============================================
                           FOOTER HALAMAN PRODI SEBELUMNYA
                           ============================================= */

                        drawFooter(
                            doc,
                            pageNumber
                        );


                        /* =============================================
                           PRODI BERBEDA -> HALAMAN BARU
                           ============================================= */

                        doc.addPage();

                        pageNumber++;


                        currentProdi =
                            mahasiswaProdi;


                        /* =============================================
                           HEADER PRODI BARU
                           ============================================= */

                        y =
                            await drawHeader(
                                doc,
                                currentProdi
                            );


                        /* =============================================
                           RESET POSISI
                           ============================================= */

                        positionIndex =
                            0;

                    }


                    /* =================================================
                       CEK BATAS 5 DATA PER HALAMAN
                       ================================================= */

                    if (
                        positionIndex >= perPage
                    ) {

                        /* =============================================
                           FOOTER HALAMAN SEKARANG
                           ============================================= */

                        drawFooter(
                            doc,
                            pageNumber
                        );


                        /* =============================================
                           BUAT HALAMAN BARU
                           ============================================= */

                        doc.addPage();

                        pageNumber++;


                        /* =============================================
                           HEADER DENGAN PRODI YANG SAMA
                           ============================================= */

                        y =
                            await drawHeader(
                                doc,
                                currentProdi
                            );


                        /* =============================================
                           RESET POSISI
                           ============================================= */

                        positionIndex =
                            0;

                    }


                    /* =================================================
                       GAMBAR DATA
                       ================================================= */

                    const rowHeight =
                        await drawStudent(
                            doc,
                            mhs,
                            y,
                            positionIndex
                        );


                    y +=
                        rowHeight;


                    positionIndex++;

                }


                /* =================================================
                   FOOTER HALAMAN TERAKHIR
                   ================================================= */

                drawFooter(
                    doc,
                    pageNumber
                );



                /* =================================================
                   NAMA FILE
                   ================================================= */

                const namaFile =
                    "Buku_Wisuda_" +
                    (
                        selectedProdi ||
                        "Semua_Prodi"
                    ) +
                    ".pdf";



                /* =================================================
                   SIMPAN PDF
                   ================================================= */

                doc.save(
                    namaFile
                );


            } catch (e) {


                console.error(
                    e
                );


                alert(
                    "Terjadi kesalahan: " +
                    e.message
                );


            } finally {


                loading.style.display =
                    "none";

            }

        }
    );


</script>


</body>

</html>
